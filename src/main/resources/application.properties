spring.application.name=RegistrarSubsystem
server.port=${SERVER_PORT:8083}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/registrar}

# Database connection. Provide real values through environment variables or a deployment secret file.
spring.datasource.url=${REGISTRAR_DB_URL}
spring.datasource.username=${REGISTRAR_DB_USERNAME}
spring.datasource.password=${REGISTRAR_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Disable Hibernate auto-updates so it doesn't mess up your tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${REGISTRAR_SHOW_SQL:false}
spring.jpa.open-in-view=false
server.error.whitelabel.enabled=false
server.error.include-message=${REGISTRAR_ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=${REGISTRAR_ERROR_INCLUDE_BINDING_ERRORS:never}
server.error.include-exception=false
server.error.include-stacktrace=never

# Daily INC expiration (1:30 AM server time). Override or disable with "-".
registrar.inc-expiration.cron=${REGISTRAR_INC_EXPIRATION_CRON:0 30 1 * * *}
# Demo-only convenience. Keep false outside controlled UAT/demo bootstraps.
registrar.demo.reset-passwords-on-boot=false
# Add this to the bottom of your existing application.properties
server.servlet.session.tracking-modes=cookie
# Allow uploading larger receipt images
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Shared file roots. Set APP_UPLOAD_DIR to the same value used by Admission.
registrar.admission.upload-dir=${APP_UPLOAD_DIR}
registrar.admission.base-url=${ADMISSION_BASE_URL}
registrar.enrollment.base-url=${ENROLLMENT_BASE_URL}
registrar.shared-upload-dir=${REGISTRAR_SHARED_UPLOAD_DIR}

# Bootstrap controls. Startup schema creation remains enabled in code; startup data seeding is disabled.
registrar.bootstrap.reference-data.enabled=${REGISTRAR_BOOTSTRAP_REFERENCE_DATA_ENABLED:false}
registrar.bootstrap.demo-data.enabled=${REGISTRAR_BOOTSTRAP_DEMO_DATA_ENABLED:false}
registrar.bootstrap.default-users.enabled=${REGISTRAR_BOOTSTRAP_DEFAULT_USERS_ENABLED:false}
registrar.bootstrap.legacy-migration.enabled=${REGISTRAR_BOOTSTRAP_LEGACY_MIGRATION_ENABLED:false}

# Account temporary passwords must come from environment/secrets, not source code.
registrar.accounts.temporary-password=${REGISTRAR_TEMP_PASSWORD:}
registrar.accounts.student-initial-password=${REGISTRAR_STUDENT_INITIAL_PASSWORD:${REGISTRAR_TEMP_PASSWORD:}}

# Tomcat Threading Optimization
server.tomcat.threads.max=${REGISTRAR_TOMCAT_THREADS_MAX:400}
server.tomcat.threads.min-spare=${REGISTRAR_TOMCAT_THREADS_MIN_SPARE:50}
server.tomcat.accept-count=${REGISTRAR_TOMCAT_ACCEPT_COUNT:200}
server.tomcat.connection-timeout=${REGISTRAR_TOMCAT_CONNECTION_TIMEOUT:20000}

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=${REGISTRAR_HIKARI_MAXIMUM_POOL_SIZE:25}
spring.datasource.hikari.minimum-idle=${REGISTRAR_HIKARI_MINIMUM_IDLE:5}
spring.datasource.hikari.connection-timeout=${REGISTRAR_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${REGISTRAR_HIKARI_MAX_LIFETIME:1800000}
  
# Spring AI MCP Server Configuration
spring.ai.mcp.server.webmvc.enabled=${REGISTRAR_MCP_ENABLED:true}
