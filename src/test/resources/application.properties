spring.datasource.url=jdbc:h2:mem:registrar-test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.main.allow-bean-definition-overriding=true
registrar.admission.upload-dir=${java.io.tmpdir}/registrar-test/admission-uploads
registrar.admission.base-url=http://localhost:8081
registrar.enrollment.base-url=http://localhost:8082
registrar.shared-upload-dir=${java.io.tmpdir}/registrar-test/enrollment-uploads
registrar.accounts.temporary-password=test-temporary-password
registrar.accounts.student-initial-password=test-student-password
registrar.bootstrap.reference-data.enabled=true
